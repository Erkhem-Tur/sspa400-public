{% extends 'lms/base.html' %}
{% block title %}Assignment settings | SSPA400{% endblock %}
{% block content %}
<div class="portal-shell form-page">
  <div class="portal-page-head"><div><h1>Assignment settings</h1><p>{{ course.title }} · {{ unit.title }}</p></div><a class="btn btn-outline-primary" href="{% url 'course_builder' course.slug %}">Back to builder</a></div>
  <div class="content-panel"><form method="post">{% csrf_token %}<div class="form-grid">{% include 'lms/includes/form_fields.html' with form=form %}</div><div class="text-end mt-3"><button class="btn btn-primary" type="submit">Save assignment</button></div></form></div>
</div>
{% endblock %}
