{% extends 'lms/base.html' %}
{% block title %}Edit category | SSPA400{% endblock %}
{% block content %}<div class="portal-shell form-page"><div class="portal-page-head"><div><h1>Edit category</h1><p>{{ category.name }}</p></div><a class="btn btn-outline-primary" href="{% url 'admin_categories' %}">Back to categories</a></div><div class="content-panel"><form method="post">{% csrf_token %}{% include 'lms/includes/form_fields.html' with form=form %}<div class="text-end"><button class="btn btn-primary" type="submit">Save category</button></div></form></div><form class="text-end mt-3" method="post" action="{% url 'admin_category_delete' category.id %}" onsubmit="return confirm('Delete this category? Courses will be kept.');">{% csrf_token %}<button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash me-1"></i> Delete category</button></form></div>{% endblock %}
