{% extends 'lms/base.html' %}
{% block title %}{{ page_title }} | SSPA400{% endblock %}
{% block content %}
<div class="portal-shell form-page">
  <div class="portal-page-head"><div><h1>{{ page_title }}</h1><p>{{ course.title }}</p></div><a class="btn btn-outline-primary" href="{% url 'course_builder' course.slug %}">Back to builder</a></div>
  <div class="content-panel"><form method="post">{% csrf_token %}{% include 'lms/includes/form_fields.html' with form=form %}<div class="text-end"><button class="btn btn-primary" type="submit">Save module</button></div></form></div>
</div>
{% endblock %}
